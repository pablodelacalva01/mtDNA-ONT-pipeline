name: ont_annot
# ----------------------------------------------------------------------------------------------------------------------------------
# Autor:   Pablo de la Calva Castineira
# Fecha:   05/05/2026
# Titulo:  "Analisis bioinformatico y su implementacion en la practica clinica
#           diaria de datos de NGS de lecturas largas mediante tecnologa Nanopore"
#
# Entorno conda para el pipeline de anotacion de variantes de lecturas mtDNA de Nanopore 
#
# Crear entorno : mamba env create -f ont_annot.yml
# Activar       : conda activate ont_annot
# Verificar     : conda env list
#
# RELACION CON ont_vc:
#   Este entorno es INDEPENDIENTE de ont_vc (variant calling).
#   Separacion deliberada para evitar conflictos Perl/Python entre VEP y Clair3/PyTorch.
#   Comparte bcftools (misma version 1.23) para garantizar compatibilidad de VCFs.
#
# HERRAMIENTAS:
#   - snpeff:      Anotacion funcional → Base de datos compatible con NC_012920.1 (rCRS)
#   - bcftools:    Anotacion con bases de datos locales (ClinVar, gnomAD mt, HmtVar)
#   - haplogrep3:  Clasificacion de haplogrupos mitocondriales 
#   - python:      Generacion del informe HTML clinico final (jinja2 + pandas)
#   - samtools:    Auxiliar (indexado, stats)
#
# NOTAS DE COMPATIBILIDAD:
#   - ensembl-vep requiere Perl >= 5.26 y entorno limpio (sin PyTorch/Python 3.11)
#   - bcftools 1.23 sincronizado con HTSlib 1.23 (igual que ont_vc)
#   - openjdk 17 requerido por haplogrep3 (igual que Mutserve2 en ont_vc)
#   - jinja2 disponible en conda-forge sin conflictos con el resto del entorno
#
# INSTALACION:
#   1. Crear entorno:
#        conda env create -f ont_vc.yml
#   2. Activar:
#        conda activate ont_vc
#   3. Instalar base de datos SnpEff (mtDNA incluido):
#      snpEff download GRCh38.99
#      
#    NOTAS:
#      - Se descarga una sola vez
#      - Para actualizar cuando salga nueva version de SnpEff:
#          conda update -c bioconda snpeff     # actualiza binario
#          snpEff download GRCh38.99           # actualiza DB si cambia version
#      - Para verificar la instalacion:
#          snpEff databases | grep GRCh38
#   4. Descargar e instalar Haplogrep3 (solo version java (.jar) no disponible para conda):
#      HAPLOGREP_DIR="/home/.../haplogrep3" 
#      mkdir -p "${HAPLOGREP_DIR}"
#      wget -O "${HAPLOGREP_DIR}/haplogrep3.jar" https://github.com/genepi/haplogrep3/releases/latest/download/haplogrep3.jar
#      
#      4.1. Verificar: java -jar "${HAPLOGREP_DIR}/haplogrep3.jar" --version
#      4.2. Enlace simbolico para comodidad en el pipeline: ln -s "${HAPLOGREP_DIR}/haplogrep3.jar" /home/.../haplogrep3.jar
#   5. Descarga de base de datos de anotacion:
#    DB_DIR="/home/.../Annotation_DBs"
#    mkdir -p "${DB_DIR}"
#    cd "${DB_DIR}"
#
#    5.1. ClinVar (variantes patogrnicas humanas, incluye mtDNA):
#         wget https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz
#         wget https://ftp.ncbi.nlm.nih.gov/pub/clinvar/vcf_GRCh38/clinvar.vcf.gz.tbi
#         # Filtrar solo variantes mitocondriales y renombrar contig chrM → NC_012920.1:
#         echo "chrM NC_012920.1" > chrM_to_rCRS.txt
#         bcftools view -r chrM clinvar.vcf.gz | bcftools annotate --rename-chrs chrM_to_rCRS.txt \
#             -Oz -o clinvar_mt_rCRS.vcf.gz
#         bcftools index --tbi clinvar_mt_rCRS.vcf.gz
#         rm -f clinvar.vcf.gz clinvar.vcf.gz.tbi
#
#    5.2. gnomAD mitocondrial v3.1 (frecuencias poblacionales):
#         wget https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/vcf/genomes/gnomad.genomes.v3.1.sites.chrM.vcf.bgz
#         wget https://storage.googleapis.com/gcp-public-data--gnomad/release/3.1/vcf/genomes/gnomad.genomes.v3.1.sites.chrM.vcf.bgz.tbi
#         # Renombrar contig chrM → NC_012920.1:
#         bcftools annotate --rename-chrs chrM_to_rCRS.txt gnomad.genomes.v3.1.sites.chrM.vcf.bgz \
#             -Oz -o gnomad_mt_rCRS.vcf.gz
#         bcftools index --tbi gnomad_mt_rCRS.vcf.gz
#         rm -f gnomad.genomes.v3.1.sites.chrM.vcf.bgz gnomad.genomes.v3.1.sites.chrM.vcf.bgz.tbi
#
#    5.3. HmtVar (patogenicidad + frecuencias HmtDB):
#         wget "https://www.hmtvar.uniba.it/api/main/mutation/all/?format=vcf" \
#             -O hmtvar_all.vcf
#         bgzip hmtvar_all.vcf
#         bcftools index --tbi hmtvar_all.vcf.gz
#         NOTA: HmtVar usa coordenadas rCRS (NC_012920.1) de forma nativa (no renombrar)
#   6. Actualizacion periodica de la base de datos (opcional recomendado):
#
#    El script de actualizacion incluido en la Parte 4 del pipeline:
#        bash parte4_update_dbs.sh
#
#    Para actualizar SnpEff:
#        conda activate ont_annot
#        conda update -c bioconda snpeff
#        snpEff download GRCh38.99    # solo si cambia la version de la DB
# ----------------------------------------------------------------------------------------------------------------------------------
channels:
  - conda-forge
  - bioconda
  - defaults
 
dependencies:
  - snpeff=5.2                 # Anotador funcional principal (gen, region, impacto, HGVS)
                               # DB GRCh38.99 compatible con NC_012920.1 (rCRS) de forma nativa

  - bcftools=1.23              # Anotacion con DBs locales (ClinVar, gnomAD, HmtVar)
                               # Misma version que ont_vc (compatibilidad total de VCFs)

  - htslib=1.23                # HTSlib compartida bcftools/samtools (sincronizada con ont_vc)
  - samtools=1.23              

  - openjdk=17                 # Requerido por haplogrep3.jar (misma version que en ont_vc)
 
  - python=3.10                # Python 3.10: compatible con todas las dependencias del entorno

  - jinja2                     # Motor de plantillas para generacion del informe HTML clinico
  - pandas                     
  - numpy                      # Dependencia de pandas
 
  - tabix                      # Indexado tabix de VCFs bgzipped
  - pigz                       
 
  - make
  - gcc

# ----------------------------------------------------------------------------------------------------------------------------------

