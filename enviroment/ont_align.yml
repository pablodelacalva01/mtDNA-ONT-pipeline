name: ont_align
# --------------------------------------------------------------------------------
# Entorno conda para el pipeline de alineamiento de lecturas Nanopore
# Orden del procesamiento:
#   indexado ref (samtools faidx + minimap2 -d) →
#   minimap2/ngmlr → BAM → sort → index → flagstat → qualimap
#
# Crear entorno : conda env create -f ont_align.yml
# Activar       : conda activate ont_align
#
# --------------------------------------------------------------------------------
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.8

  # Alineamiento
  - minimap2=2.28           # alineador principal ONT (preset map-ont)
  - ngmlr=0.2.7             # alineador alternativo, mejor sensibilidad en algunas regiones

  # Manipulación BAM
  - samtools=1.19           # sort, index, flagstat, faidx, view

  # QC del alineamiento
  - qualimap=2.3            # bamqc: cobertura, profundidad, GC, distribución de longitudes
  - gatk4=4.4.0.0           # Mutect2 (modo mitocondrial), HaplotypeCaller

  # Dependencias
  - openjdk=17              # requerido por Picard y GATK4
  - numpy>=1.16.0           # requerido por plot_coverage.py
  - pandas>=0.25.0          # requerido por plot_coverage.py
  - matplotlib              # requerido por plot_coverage.py
