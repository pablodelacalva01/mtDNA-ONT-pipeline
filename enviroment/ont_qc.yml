name: ont_qc
# --------------------------------------------------------------------------------
# Entorno conda para el pipeline de QC y filtrado de lecturas Nanopore
# Orden del procesamiento:
#   creación de directorios → entrada de datos → nanoplot → porechop
#   → nanofilt → filtlong → nanoplot (post-filtrado)
#
# Crear entorno : conda env create -f ont_qc.yml
# Activar       : conda activate ont_qc
# --------------------------------------------------------------------------------
channels:
  - bioconda
  - conda-forge
  - defaults
dependencies:
  - python=3.8

  # QC de lecturas ONT
  - nanoplot=1.42.0         # visualización: longitud, calidad, N50
  - nanostat=1.6.0          # estadísticas resumen (incluido en nanopack)

  # Eliminación de adaptadores
  - porechop=0.2.4          # trimming adaptadores específicos ONT

  # Filtrado de lecturas
  - nanofilt=2.8.0          # filtrado por calidad (-q), longitud (-l) y headcrop
  - filtlong=0.2.1          # optimización: selección de mejores lecturas por calidad/longitud

  # Dependencias Python requeridas por nanopack
  - numpy>=1.16.0
  - pandas>=0.25.0
  - matplotlib>=3.0.0
  - seaborn>=0.11.0
  - biopython>=1.70
  - plotly>=4.0.0
  - pyarrow>=0.14.0
